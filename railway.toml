[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# The service needs a volume mounted at /app/data for SQLite, uploads, and
# exports, and should run as a single replica — see docs/deployment.md.
